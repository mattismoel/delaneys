services:
  caddy:
    image: caddy:latest
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    deploy:
      restart_policy:
        condition: any
        delay: 5s
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

  frontend:
    image: ghcr.io/mattismoel/delaneys/frontend:main
    env_file: .env.production
    deploy:
      restart_policy:
        condition: any
        delay: 5s

  backend:
    image: ghcr.io/mattismoel/delaneys/backend:main
    deploy:
      restart_policy:
        condition: any
        delay: 5s
    volumes:
      - pb_data:/pb/pb_data

volumes:
  caddy_data:
  caddy_config:
  pb_data:

configs:
  caddyfile:
    file: ./Caddyfile
