name: Publish Backend

env:
  REGISTRY: ghcr.io
  PACKAGE_NAME: backend
on:
  push:
    branches: ["main", "dev", "edge"]
    paths:
      - "backend/**"

jobs:
  publish-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Publish Backend
        uses: mattismoel/actions/deploy@main
        with:
          context: ./backend
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_name: backend
